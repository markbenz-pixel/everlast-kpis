<title>KPIs Ventas · Everlast</title>
<style>
:root{color-scheme:light;
 --page:#F3F5F7;--card:#FFFFFF;--border:#E4E7EC;--ink:#1A2B4A;--muted:#6B7280;--faint:#9AA3AF;
 --navy:#2C3741;--teal:#5EC6D0;--track:#EEF1F4;
 --t0:#DC2626;--t1:#F97316;--t2:#16A34A;--t3:#2563EB;
 --t0bg:#FEE2E2;--t1bg:#FFEDD5;--t2bg:#DCFCE7;--t3bg:#DBEAFE;
 --t0fg:#B91C1C;--t1fg:#C2410C;--t2fg:#15803D;--t3fg:#1D4ED8;}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
 --page:#111417;--card:#1A1F25;--border:#2A313A;--ink:#EDF0F3;--muted:#A3ACB8;--faint:#6B7480;
 --track:#262D36;--t0:#F26D6D;--t1:#FB923C;--t2:#34C46A;--t3:#5B9BF5;
 --t0bg:#3B1A1A;--t1bg:#3B2410;--t2bg:#12321E;--t3bg:#152A4A;
 --t0fg:#FCA5A5;--t1fg:#FDBA74;--t2fg:#86EFAC;--t3fg:#93C5FD;}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
 font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px}
header img{height:26px}
header{flex-wrap:wrap}
header .ttl{font-weight:600;font-size:15px;letter-spacing:.2px}
.upd{display:none;margin-left:auto;align-items:center;gap:10px;flex-wrap:wrap}
.upd .age{font-size:12.5px;color:#B7C0C9}
.upd .age.stale{color:#FDBA74}
.upd .st{font-size:12.5px;color:#B7C0C9;flex-basis:100%;text-align:right}
#refresh{font:inherit;font-size:13px;font-weight:600;color:#fff;text-decoration:none;
 background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;
 padding:6px 14px;cursor:pointer;white-space:nowrap}
#refresh:hover{background:rgba(255,255,255,.24)}
header .ttl small{display:block;color:#B7C0C9;font-weight:400;font-size:12px}
main{max-width:1080px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:8px 14px;
 border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.range{margin-left:auto;color:var(--muted);font-size:13px}
.period{display:none}.period.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .val{font-size:26px;font-weight:600;margin:4px 0 2px;letter-spacing:-.5px;overflow-wrap:anywhere}
.stat.hero{grid-column:1/-1;border-left:4px solid var(--teal)}
.stat.hero .val{font-size:48px}
.stat .sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 12px}h2 small{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:8px}
.bars{position:relative;padding:4px 0}
.bars::before{content:"";position:absolute;top:0;bottom:0;left:calc(120px + (100% - 120px - 74px) * var(--line) / 100%);
 border-left:2px dashed var(--faint);z-index:1}
.row{display:grid;grid-template-columns:120px 1fr 74px;align-items:center;gap:8px;padding:5px 0}
.row .name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .track{height:14px;background:var(--track);border-radius:4px;overflow:hidden}
.row .fill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.row .num{font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.row.thin{opacity:.5}
.fill.t0,.dot.t0{background:var(--t0)}.fill.t1,.dot.t1{background:var(--t1)}
.fill.t2,.dot.t2{background:var(--t2)}.fill.t3,.dot.t3{background:var(--t3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.t0{background:var(--t0bg);color:var(--t0fg)}.pill.t1{background:var(--t1bg);color:var(--t1fg)}
.pill.t2{background:var(--t2bg);color:var(--t2fg)}.pill.t3{background:var(--t3bg);color:var(--t3fg)}
.tbl{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:720px}
th{text-align:right;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
 padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--border)}
.foot{color:var(--faint);font-size:12px;text-align:center;margin:18px 0 8px}
/* gate */
.gate{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px}
.gate h1{font-size:18px;margin:0 0 4px}.gate p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.gate input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border);
 border-radius:8px;background:var(--page);color:var(--ink)}
.gate label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin:12px 0}
.gate button{width:100%;font:inherit;font-weight:600;font-size:15px;padding:11px;border:0;border-radius:8px;
 background:var(--navy);color:#fff;cursor:pointer}
.gate .err{color:var(--t0fg);font-size:13px;min-height:18px;margin-top:8px}
@media (max-width:600px){.row{grid-template-columns:92px 1fr 64px}.bars::before{left:calc(92px + (100% - 92px - 64px) * var(--line) / 100%)}
 .stat .val{font-size:24px}.stat.hero .val{font-size:38px}.range{width:100%;margin:2px 0 0}}
</style></head>

<script>
(function(){
  var P = document.getElementById('payload');
  var enc = P.dataset.enc === '1';
  var LS = 'kpi_pw';
  var BUILD = document.querySelector('meta[name="kpi-build"]').content;

  function ago(){
    var el = document.getElementById('age');
    var mins = Math.round((Date.now() - Date.parse(BUILD)) / 60000);
    if (mins < 0) mins = 0;
    var t = mins < 1 ? 'recién' : mins < 60 ? 'hace ' + mins + ' min'
          : 'hace ' + Math.floor(mins / 60) + ' h' + (mins % 60 ? ' ' + (mins % 60) + ' min' : '');
    el.textContent = 'Datos de ' + t;
    el.classList.toggle('stale', mins > 180);
  }

  var AUTO_MINS = 30;   // al abrir, si los datos son mas viejos que esto, refresca solo

  // Recarga por una URL que ningun cache puede tener guardada. location.reload()
  // no alcanza: el web app de la pantalla de inicio sirve su propia copia vieja.
  function hardReload(){
    location.replace(location.pathname + '?r=' + Date.now());
  }

  // Espera a que Pages publique un build.txt distinto del que trajo esta pagina.
  // El workflow tarda ~40s y Pages otro tanto en publicarlo. Si a los 150s no
  // detectamos nada recargamos igual: entre el CDN y el cache del telefono el
  // sondeo puede no enterarse nunca, y la recarga limpia trae lo que haya.
  function waitForBuild(st, deadline, url){
    var t0 = Date.now(), tick = 0;
    var timer = setInterval(async function(){
      var secs = Math.round((Date.now() - t0) / 1000);
      tick++;
      var done = false;

      // 1. El centinela publicado. Es la señal buena, pero viaja por el CDN y
      //    por el cache del telefono, asi que puede mentir por minutos.
      try {
        var res = await fetch('./build.txt?t=' + Date.now(), {cache: 'no-store'});
        var txt = (await res.text()).trim();
        if (res.ok && txt && txt !== BUILD) done = true;
      } catch(e) {}

      // 2. Preguntarle al Worker si la corrida ya termino. Esto no pasa por
      //    ningun cache, asi que funciona cuando el centinela esta ciego.
      //    Un Worker viejo contesta otra cosa y simplemente se ignora.
      if (!done && url && tick % 2 === 0) {
        try {
          var c = await (await fetch(url + '?check=1', {method: 'POST'})).json();
          if (c.status === 'completed' && c.secs >= 10) done = true;
        } catch(e) {}
      }

      if (done) {
        clearInterval(timer);
        st.textContent = 'Listo, recargando…';
        setTimeout(hardReload, 800);
        return;
      }
      if (secs > deadline) { clearInterval(timer); st.textContent = 'Recargando…'; hardReload(); return; }
      st.textContent = 'Buscando datos nuevos… ' + secs + 's';
    }, 3000);
  }

  // El POST al Worker no lleva credenciales: el token de GitHub vive alla.
  async function trigger(url, st){
    if (st.dataset.busy) return;
    st.dataset.busy = '1';
    st.textContent = 'Pidiendo datos nuevos…';
    var r;
    try {
      r = await (await fetch(url, {method: 'POST'})).json();
    } catch(e) {
      st.textContent = 'No se pudo conectar para actualizar.'; st.dataset.busy = ''; return;
    }
    if (r.status === 'started' || r.status === 'running') {
      waitForBuild(st, 90, url);
    } else if (r.status === 'cooldown') {
      // El Worker no disparo nada: ya hubo un build hace menos de 2 min. O ya
      // esta publicado (el primer sondeo lo ve) o le falta poco; no tiene
      // sentido esperar el ciclo entero.
      st.textContent = 'Recién se actualizó, viendo si ya llegó…';
      waitForBuild(st, 45, url);
    } else {
      st.textContent = 'No se pudo disparar (' + (r.status || '?') + ').';
      st.dataset.busy = '';
    }
  }

  function wireRefresh(url){
    document.getElementById('upd').style.display = 'flex';
    ago(); setInterval(ago, 60000);
    var btn = document.getElementById('refresh'), st = document.getElementById('upst');
    if (!url) {   // sin Worker: el boton solo abre Run workflow en GitHub
      btn.href = btn.dataset.run; btn.target = '_blank'; btn.rel = 'noopener';
      btn.addEventListener('click', function(){ waitForBuild(st, 150); });
      return;
    }
    btn.addEventListener('click', function(e){ e.preventDefault(); trigger(url, st); });

    // Auto-refresco al abrir, con freno: si el build nuevo no llegara a
    // cambiar esta pagina (CDN atrasado, build fallado), sin este freno cada
    // recarga volveria a disparar y la pestaña entraria en bucle.
    var mins = (Date.now() - Date.parse(BUILD)) / 60000;
    if (mins <= AUTO_MINS) return;
    try {
      var last = +sessionStorage.getItem('kpi_auto') || 0;
      if (Date.now() - last < 600000) return;
      sessionStorage.setItem('kpi_auto', Date.now());
    } catch(e) {}
    trigger(url, st);
  }

  function show(raw){
    var data = JSON.parse(raw);
    var app = document.getElementById('app');
    app.innerHTML = data.h;
    wireRefresh(data.u);
    document.getElementById('gate').style.display = 'none';
    var tabs = app.querySelectorAll('.tab'), secs = app.querySelectorAll('.period');
    function pick(id){
      tabs.forEach(function(t){ t.classList.toggle('on', t.dataset.p === id); });
      secs.forEach(function(s){ s.classList.toggle('on', s.id === 'p-' + id); });
      var cur = app.querySelector('#p-' + id);
      document.getElementById('range').textContent = cur ? cur.dataset.range : '';
      try { localStorage.setItem('kpi_tab', id); } catch(e){}
    }
    tabs.forEach(function(t){ t.addEventListener('click', function(){ pick(t.dataset.p); }); });
    var saved = null; try { saved = localStorage.getItem('kpi_tab'); } catch(e){}
    pick(saved && app.querySelector('#p-' + saved) ? saved : tabs[0].dataset.p);
  }
  function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  async function decrypt(pw){
    var salt = b64(P.dataset.salt), iv = b64(P.dataset.iv), data = b64(P.textContent.trim());
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:+P.dataset.iter, hash:'SHA-256'},
                                            km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, data);
    return new TextDecoder().decode(plain);
  }
  async function attempt(pw, remember){
    var err = document.getElementById('err'), btn = document.getElementById('go');
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Abriendo…';
    try {
      var html = await decrypt(pw);
      if (remember) { try { localStorage.setItem(LS, pw); } catch(e){} }
      show(html);
    } catch(e) {
      try { localStorage.removeItem(LS); } catch(e2){}
      err.textContent = 'Contraseña incorrecta.';
      btn.disabled = false; btn.textContent = 'Entrar';
      document.getElementById('gate').style.display = '';
    }
  }
  if (!enc) { show(P.textContent); return; }
  var saved = null; try { saved = localStorage.getItem(LS); } catch(e){}
  if (saved) { document.getElementById('gate').style.display = 'none'; attempt(saved, true); }
  document.getElementById('gate').addEventListener('submit', function(ev){
    ev.preventDefault();
    attempt(document.getElementById('pw').value, document.getElementById('rem').checked);
  });
})();
</script>
